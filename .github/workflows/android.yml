name: Compilar APK RelojDigital

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar GraalVM para Gluon
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar APK
        run: |
          cd RelojDigital
          mvn clean gluonfx:build gluonfx:package -Pandroid

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: app-reloj-digital
          path: RelojDigital/target/gluonfx/aarch64-android/gvm/*.apk
